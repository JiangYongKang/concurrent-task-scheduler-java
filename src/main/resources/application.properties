# ====== 配额感知本地任务调度器配置（前缀 task.scheduler） ======
# 全局执行线程数：所有调用方/任务组共享的并发硬上限
task.scheduler.worker-threads=4
# 每个 caller:group 的默认配额：最大并发 / 每秒最多启动数 / 最大排队长度
task.scheduler.default-max-concurrency=2
task.scheduler.default-rate-limit-per-second=2
task.scheduler.default-max-queued=100
# 执行与重试
task.scheduler.default-timeout-millis=30000
task.scheduler.default-max-retries=2
task.scheduler.backoff-base-millis=200
task.scheduler.backoff-multiplier=2.0
task.scheduler.backoff-cap-millis=10000
# 0 表示退避不抖动（结果确定）；&gt;0 时叠加比例抖动
task.scheduler.backoff-jitter=0.0
# WAL 持久化（JSON Lines，本地文件，不依赖外部数据库/缓存/MQ）
task.scheduler.wal-file=data/task-scheduler.wal
task.scheduler.wal-fsync=true
# 运行期治理事件日志（配额调整/暂停/恢复）；留空时默认在 WAL 同目录生成 *.governance.jsonl
task.scheduler.governance-file=

