# ============================================================
# 配额感知本地异步任务调度器配置
# ============================================================

# 任务持久化目录（每任务一个 JSON 文件，原子写入）
scheduler.data-dir=data/tasks

# 全局并发上限（工作线程数）
scheduler.global-max-concurrency=8
# 全局排队上限（超出后提交被拒绝 REJECTED/GLOBAL_QUEUE_FULL）
scheduler.global-max-queued=200
# 全局每秒执行启动量（令牌桶，仅在任务开始执行时消耗）
scheduler.global-rate-limit-per-second=20

# 单个调用方默认配额
scheduler.default-max-concurrency=2
scheduler.default-max-queued=50
scheduler.default-rate-limit-per-second=5

# 单次尝试超时（毫秒），超时任务终态 TIMED_OUT，不重试
scheduler.attempt-timeout-millis=30000
# 默认最大尝试次数（含首次；1 表示不重试）
scheduler.default-max-attempts=3
# 指数退避：delay = min(base * multiplier^(attempt-1), max)
scheduler.backoff-base-millis=200
scheduler.backoff-multiplier=2.0
scheduler.max-backoff-millis=10000

# 重启时发现 RUNNING 任务：默认判 FAILED(RESTART_INTERRUPTED)；true 时退避重试（要求处理器幂等）
scheduler.retry-running-tasks-on-restart=false

# 派发扫描间隔（毫秒）
scheduler.tick-millis=10

# ---- 按调用方覆盖（可选）----
